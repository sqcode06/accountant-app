name: iOS

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Xcode ${{ matrix.xcode }} / iOS ${{ matrix.ios }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "16.4"
            ios: "18.5"
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
            destination: platform=iOS Simulator,name=iPhone 16,OS=18.5
            artifact_suffix: xcode16.4-ios18.5
          - xcode: "26.2"
            ios: "26.2"
            developer_dir: /Applications/Xcode_26.2.app/Contents/Developer
            destination: platform=iOS Simulator,name=iPhone 16,OS=26.2
            artifact_suffix: xcode26.2-ios26.2
    defaults:
      run:
        working-directory: renamed-ios-checkout
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      PROJECT: AccountantApp/AccountantApp.xcodeproj
      SCHEME: AccountantApp
      TEST_PLAN: AccountantApp
      DESTINATION: ${{ matrix.destination }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: renamed-ios-checkout

      - name: Record toolchain and revision
        shell: bash
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/revision.txt
          xcodebuild -version | tee artifacts/xcode-version.txt
          xcrun simctl list runtimes | tee artifacts/simulator-runtimes.txt

      - name: Build the Release iOS app
        shell: bash
        env:
          DERIVED_DATA: ${{ runner.temp }}/AccountantDerivedData
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            build 2>&1 | tee artifacts/xcodebuild.log

      - name: Run native unit and UI tests
        shell: bash
        env:
          DERIVED_DATA: ${{ runner.temp }}/AccountantDerivedData
          RESULT_BUNDLE: ${{ runner.temp }}/AccountantAppTests.xcresult
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -testPlan "$TEST_PLAN" \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            test 2>&1 | tee artifacts/xcode-test.log

      - name: Collect UI-test screenshots
        if: always()
        shell: bash
        env:
          RESULT_BUNDLE: ${{ runner.temp }}/AccountantAppTests.xcresult
        run: |
          if [[ -d "$RESULT_BUNDLE" ]]; then
            xcrun xcresulttool export attachments \
              --path "$RESULT_BUNDLE" \
              --output-path artifacts/screenshots || true
          fi

      - name: Stage result bundle
        if: always()
        shell: bash
        env:
          RESULT_BUNDLE: ${{ runner.temp }}/AccountantAppTests.xcresult
        run: |
          if [[ -d "$RESULT_BUNDLE" ]]; then
            ditto "$RESULT_BUNDLE" artifacts/AccountantAppTests.xcresult
          fi

      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.artifact_suffix }}
          path: renamed-ios-checkout/artifacts
          if-no-files-found: error
          retention-days: 14
